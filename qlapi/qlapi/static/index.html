<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e10">
<title>QLApi &mdash; Brother QL label printing</title>
<style>
  :root {
    --bg: #0d0e10;
    --chrome: #17191c;
    --chrome-2: #202429;
    --line: #2c3137;
    --ink: #e8eaed;
    --dim: #8d949c;
    --accent: #ffb02e;
    --danger: #ff6b5e;
    --ok: #7ddc7d;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 14px/1.5 var(--mono);
    letter-spacing: -0.01em;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    flex: none;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px;
    background: var(--chrome);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 9px; margin-right: auto; }
  .brand b { font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; }
  .brand span { font-size: 11px; color: var(--dim); }
  nav { display: flex; gap: 6px; font-size: 12px; align-items: center; }

  .tab {
    font: inherit;
    font-size: 12px;
    color: var(--dim);
    background: none;
    border: 1px solid transparent;
    border-radius: 7px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .tab:hover { color: var(--ink); }
  .tab.on {
    color: var(--accent);
    border-color: var(--line);
    background: var(--chrome-2);
  }
  nav .docslink { margin-left: 8px; font-size: 12px; }

  .health {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11px; color: var(--dim);
    margin-left: auto;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .dot.up { background: var(--ok); }
  .dot.down { background: var(--danger); }

  /* The active view fills everything below the header. */
  main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .view { flex: 1 1 auto; min-height: 0; display: none; flex-direction: column; }
  .view.on { display: flex; }

  #viewEditor iframe {
    flex: 1 1 auto;
    width: 100%;
    border: 0;
    background: var(--bg);
  }

  #viewFile { padding: 28px 20px; overflow: auto; }
  #viewFile h1 { font-size: 18px; margin: 0 0 6px; }
  #viewFile > p { color: var(--dim); font-size: 12.5px; margin: 0 0 18px; max-width: 60ch; }

  form.printfile {
    display: flex; flex-direction: column; gap: 12px; max-width: 460px;
    background: var(--chrome);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
  }
  label.field {
    display: flex; flex-direction: column; gap: 4px;
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim);
  }
  select, input[type="number"], input[type="file"] {
    font: inherit; font-size: 13px; color: var(--ink);
    background: var(--chrome-2); border: 1px solid var(--line);
    border-radius: 7px; padding: 8px 10px;
  }
  input[type="number"] { width: 80px; }
  .check {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--ink); cursor: pointer; user-select: none;
  }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }

  button {
    font: inherit; color: var(--ink);
    background: var(--chrome-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 14px; cursor: pointer;
  }
  button.print {
    background: var(--accent); border-color: var(--accent);
    color: #17120a; font-weight: 600;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }

  #pfStatus { font-size: 12.5px; }
  #pfStatus .work { color: var(--accent); }
  #pfStatus .good { color: var(--ok); }
  #pfStatus .bad { color: var(--danger); }
</style>
</head>
<body>

<header>
  <div class="brand"><b>QLApi</b><span>Brother QL label printing</span></div>
  <nav>
    <button class="tab on" id="tabEditor">Label editor</button>
    <button class="tab" id="tabFile">Print a file</button>
    <a class="docslink" href="/docs">API docs</a>
  </nav>
  <div class="health"><i class="dot" id="hdot"></i><span id="htext">checking printer</span></div>
</header>

<main>
  <section class="view on" id="viewEditor">
    <iframe id="editorFrame" src="/editor" title="Label editor"></iframe>
  </section>

  <section class="view" id="viewFile">
    <h1>Print an existing file</h1>
    <p>Already have a label? Upload a PNG, JPG or PDF and print it directly.
       Turn on rotation to print a landscape image across the tape.</p>
    <form class="printfile" id="pfForm">
      <label class="field">File (png, jpg, jpeg, pdf)
        <input type="file" id="pfFile" accept=".png,.jpg,.jpeg,.pdf" required>
      </label>
      <div class="row">
        <label class="field">Copies
          <input type="number" id="pfCopies" min="1" max="50" value="1">
        </label>
        <label class="check"><input type="checkbox" id="pfRotate"> Rotate 90&deg;</label>
        <button type="submit" class="print" id="pfBtn">Print</button>
      </div>
      <div id="pfStatus" aria-live="polite"></div>
    </form>
  </section>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  // ------------------------------------------------------------- tabs
  // The editor iframe stays mounted the whole time, so switching to the file
  // view and back never reloads it and the label being drawn is kept.
  function show(which) {
    var edit = which === "editor";
    $("viewEditor").classList.toggle("on", true);
    $("viewFile").classList.toggle("on", false);
    $("tabEditor").classList.toggle("on", edit);
    $("tabFile").classList.toggle("on", !edit);
    var frame = $("editorFrame");
    try {
      var target = edit ? "designMode" : "fileMode";
      var button = frame.contentDocument && frame.contentDocument.getElementById(target);
      if (button) button.click();
    } catch (err) {}
  }
  $("tabEditor").onclick = function () { show("editor"); };
  $("tabFile").onclick = function () { show("file"); };
  $("editorFrame").onload = function () { if (location.hash === "#file") show("file"); };

  if (location.hash === "#file") show("file");

  // ------------------------------------------------------------- health
  async function checkHealth() {
    var dot = $("hdot"), txt = $("htext");
    try {
      var res = await fetch("/health");
      var list = await res.json();
      var p = list[0];
      if (!p) throw new Error("no printer");
      dot.className = "dot " + (p.available ? "up" : "down");
      txt.textContent = p.available ? p.model + " ready" : (p.error || "printer unavailable");
    } catch (err) {
      dot.className = "dot down";
      txt.textContent = "printer unreachable";
    }
  }

  // -------------------------------------------------------- print a file
  function pfSay(cls, text) {
    $("pfStatus").innerHTML = '<span class="' + cls + '">' + text + "</span>";
  }

  async function detail(res) {
    try {
      var body = await res.json();
      if (body && body.detail) return typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
    } catch (err) { /* non-JSON body */ }
    return "Server responded " + res.status + ".";
  }

  $("pfForm").onsubmit = async function (e) {
    e.preventDefault();
    var btn = $("pfBtn");
    var file = $("pfFile").files[0];
    if (!file) { pfSay("bad", "Pick a file first."); return; }
    if (!/\.(png|jpe?g|pdf)$/i.test(file.name)) {
      pfSay("bad", "Only png, jpg, jpeg and pdf files can be printed.");
      return;
    }

    var copies = Math.max(1, parseInt($("pfCopies").value, 10) || 1);
    btn.disabled = true;
    try {
      var fd = new FormData();
      fd.append("label_file", file, file.name);
      var q = "?rotate=" + ($("pfRotate").checked ? "true" : "false") + "&copies=" + copies;
      pfSay("work", "Sending to printer&hellip;");

      var res = await fetch("/job" + q, { method: "POST", body: fd });
      if (!res.ok) { pfSay("bad", await detail(res)); return; }
      var job = await res.json();
      pfSay("work", "Queued as job " + job.job_id + "&hellip;");

      // Poll until the background worker reaches a terminal state.
      for (var i = 0; i < 150; i++) {
        await new Promise(function (r) { setTimeout(r, 700); });
        var sres = await fetch("/job/" + encodeURIComponent(job.job_id));
        if (!sres.ok) { pfSay("bad", await detail(sres)); return; }
        var s = await sres.json();
        if (s.status === "done") {
          pfSay("good", "Printed " + copies + " cop" + (copies === 1 ? "y" : "ies") + ".");
          return;
        }
        if (s.status === "failed") {
          pfSay("bad", s.error || "The print job failed.");
          return;
        }
      }
      pfSay("bad", "Still not finished. Job id " + job.job_id + ".");
    } catch (err) {
      pfSay("bad", err && err.message ? err.message : "Could not reach the server.");
    } finally {
      btn.disabled = false;
      checkHealth();
    }
  };

  checkHealth();
})();
</script>
</body>
</html>
