<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e10">
<title>Label editor</title>
<style>
  :root {
    --bg: #0d0e10;
    --chrome: #17191c;
    --chrome-2: #202429;
    --line: #2c3137;
    --ink: #e8eaed;
    --dim: #8d949c;
    --accent: #ffb02e;
    --danger: #ff6b5e;
    --ok: #7ddc7d;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 14px/1.35 var(--mono);
    letter-spacing: -0.01em;
    display: flex;
    flex-direction: column;
    overscroll-behavior: none;
  }

  /* ---------- top chrome ---------- */

  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: calc(10px + var(--safe-t)) calc(14px + var(--safe-r)) 10px calc(14px + var(--safe-l));
    background: var(--chrome);
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 9px;
    margin-right: auto;
  }
  .brand b {
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .brand span {
    font-size: 11px;
    color: var(--dim);
  }

  .health {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--dim);
    white-space: nowrap;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--dim);
    box-shadow: 0 0 0 0 currentColor;
  }
  .dot.up { background: var(--ok); }
  .dot.down { background: var(--danger); }

  /* ---------- controls ---------- */

  label.field {
    display: inline-flex;
    flex-direction: column;
    gap: 4px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
  }

  select, input[type="number"], input[type="text"], input[type="file"], textarea {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--chrome-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 9px;
    min-height: 36px;
    appearance: none;
  }
  textarea { resize: vertical; line-height: 1.4; }
  select { padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: right 12px center, right 7px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  input[type="number"] { width: 68px; }
  select:focus-visible, input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .check {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
    user-select: none;
    min-height: 36px;
  }
  .check input { accent-color: var(--accent); width: 17px; height: 17px; }
  /* die-cut labels cannot be turned -- the control stays visible but inert */
  .check.off { opacity: .4; cursor: not-allowed; }

  button {
    font: inherit;
    color: var(--ink);
    background: var(--chrome-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    min-height: 40px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: background .12s ease, border-color .12s ease, transform .06s ease;
  }
  button:hover:not(:disabled) { background: #282d33; border-color: #3a4148; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button svg { width: 18px; height: 18px; display: block; }

  .print {
    background: var(--accent);
    border-color: var(--accent);
    color: #17120a;
    font-weight: 600;
    padding-inline: 20px;
    letter-spacing: 0.02em;
  }
  .print:hover:not(:disabled) { background: #ffc056; border-color: #ffc056; }
  .print.busy { background: var(--chrome-2); border-color: var(--line); color: var(--dim); }

  /* ---------- stage ---------- */

  main {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px calc(16px + var(--safe-r)) 20px calc(16px + var(--safe-l));
    background:
      radial-gradient(120% 90% at 50% 0%, #1a1d21 0%, var(--bg) 60%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.022) 0 1px, transparent 1px 34px);
  }

  #stage { position: relative; }

  .tag {
    /* Grows upward from just above the tape, and is allowed to be wider than
       the tape itself -- a rotated strip can be very narrow. */
    position: absolute;
    left: 46px;
    bottom: 100%;
    margin-bottom: 7px;
    width: max-content;
    max-width: min(72vw, 620px);
    font-size: 10px;
    line-height: 1.4;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .tag b { color: var(--accent); font-weight: 500; }

  .stagerow { display: flex; align-items: stretch; gap: 12px; }

  /* ---------- feed direction rail ----------
     Follows the feed axis of the canvas: vertical in portrait (rows leave
     top-first), horizontal in landscape (the right edge leads). */
  .feed {
    flex: none;
    width: 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--dim);
    user-select: none;
  }
  .feed .head { flex: none; color: var(--accent); }
  .feed .head svg { width: 16px; height: 16px; display: block; }
  .feed .rail {
    flex: 1 1 auto;
    width: 1px;
    min-height: 10px;
    background: linear-gradient(180deg, var(--accent), rgba(255,176,46,.15));
  }
  .feed .cap {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    white-space: nowrap;
    padding-block: 4px;
  }
  .feed .foot {
    flex: none;
    font-size: 9px;
    letter-spacing: 0.06em;
    color: #5f666d;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    white-space: nowrap;
  }

  /* Landscape: the rail lies above the tape and runs left-to-right, with the
     arrowhead at the leading (right) edge. */
  .stagerow.turned { flex-direction: column; }
  .feed.turned {
    flex-direction: row-reverse;
    width: auto;
    height: 20px;
  }
  .feed.turned .head svg { transform: rotate(90deg); }
  .feed.turned .rail {
    width: auto;
    height: 1px;
    min-width: 10px;
    background: linear-gradient(90deg, rgba(255,176,46,.15), var(--accent));
  }
  .feed.turned .cap,
  .feed.turned .foot {
    writing-mode: horizontal-tb;
    transform: none;
    padding-block: 0;
  }

  /* the tape: white print area, dark cutting-mat feel around it.
     #tape just wraps the canvas -- the canvas itself already carries the
     orientation, because landscape swaps which axis is across the tape.
     Nothing here is ever rotated. */
  #tape {
    position: relative;
    flex: none;
    filter: drop-shadow(0 18px 34px rgba(0,0,0,.6));
  }
  #tape::before {
    /* perforation / edge-of-tape hint */
    content: "";
    position: absolute;
    inset: -9px -3px;
    border-radius: 3px;
    background:
      repeating-linear-gradient(180deg, #cfd3d6 0 5px, transparent 5px 11px) left / 3px 100% no-repeat,
      repeating-linear-gradient(180deg, #cfd3d6 0 5px, transparent 5px 11px) right / 3px 100% no-repeat;
    opacity: .5;
    pointer-events: none;
  }
  #tape.diecut::before { display: none; }
  #tape.diecut .canvas-container { border-radius: 10px; overflow: hidden; }

  /* Landscape: the tape edges run horizontally instead, so the perforation
     hint moves to the top and bottom. */
  #tape.turned::before {
    inset: -3px -9px;
    background:
      repeating-linear-gradient(90deg, #cfd3d6 0 5px, transparent 5px 11px) top / 100% 3px no-repeat,
      repeating-linear-gradient(90deg, #cfd3d6 0 5px, transparent 5px 11px) bottom / 100% 3px no-repeat;
  }

  /* leading edge: the row printed first is the one that leaves first.
     Portrait sends canvas rows top-first. Landscape is rotated 90 deg CCW by
     the printer, which puts the canvas's RIGHT edge out in front. */
  #tape::after {
    content: "";
    position: absolute;
    left: 0; right: 0; top: -1px;
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 11px);
    pointer-events: none;
  }
  #tape.turned::after {
    left: auto; right: -1px; top: 0; bottom: 0;
    width: 2px; height: auto;
    background: repeating-linear-gradient(180deg, var(--accent) 0 6px, transparent 6px 11px);
  }

  .canvas-container { background: #fff; }
  canvas { display: block; touch-action: none; }

  /* ---------- bottom chrome ---------- */

  footer {
    flex: none;
    background: var(--chrome);
    border-top: 1px solid var(--line);
    padding-bottom: var(--safe-b);
  }

  .props {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));
    border-bottom: 1px solid var(--line);
    background: var(--chrome-2);
    overflow-x: auto;
  }
  .props.on { display: flex; }
  .props .cap {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
    flex: none;
  }
  .props button { min-height: 34px; padding: 6px 11px; }
  .props button.sel { background: var(--accent); border-color: var(--accent); color: #17120a; }
  .props .sep { width: 1px; align-self: stretch; background: var(--line); flex: none; margin: 2px 3px; }
  /* the bar is shared: the text-only controls fold away for images and icons */
  .props.notext .txt { display: none; }
  .props button.slot { border-color: #4a3a1c; color: var(--accent); }

  .tools {
    display: flex;
    gap: 8px;
    padding: 10px calc(12px + var(--safe-r)) 12px calc(12px + var(--safe-l));
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tools::-webkit-scrollbar { display: none; }
  .tools button { flex: none; white-space: nowrap; }
  .tools .grow { flex: 1 1 auto; min-width: 0; }
  .tools .danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }

  /* ---------- icon sheet ---------- */

  .sheet {
    position: fixed;
    inset: 0;
    background: rgba(6,7,8,.66);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 40;
  }
  .sheet.on { display: flex; }
  .sheet-inner {
    width: 100%;
    max-width: 520px;
    background: var(--chrome);
    border: 1px solid var(--line);
    border-bottom: 0;
    border-radius: 16px 16px 0 0;
    padding: 14px 14px calc(16px + var(--safe-b));
    animation: rise .16s ease-out;
  }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } }
  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
    gap: 8px;
  }
  .grid button {
    flex-direction: column;
    gap: 6px;
    padding: 12px 4px;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.04em;
  }
  .grid button svg { width: 26px; height: 26px; color: var(--ink); }

  /* ---------- sheet forms & lists (templates, slots, filling) ---------- */

  .form { display: flex; flex-direction: column; gap: 11px; max-height: 56vh; overflow-y: auto; }
  .form label.field { display: flex; }
  .form input, .form select, .form textarea { width: 100%; }
  .form .hint { font-size: 11px; color: var(--dim); letter-spacing: 0; text-transform: none; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row .grow { flex: 1 1 auto; }

  .list { display: flex; flex-direction: column; gap: 6px; max-height: 44vh; overflow-y: auto; margin-bottom: 12px; }
  .item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--chrome-2);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 10px;
  }
  .item .nm { flex: 1 1 auto; min-width: 0; }
  .item .nm b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
  .item button { min-height: 30px; padding: 4px 9px; font-size: 12px; }
  .item .danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  .empty { color: var(--dim); font-size: 12px; padding: 12px 2px; line-height: 1.5; }

  /* ---------- status ---------- */

  #status {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(var(--safe-b) + 96px);
    z-index: 60;
    display: flex;
    flex-direction: column;
    gap: 7px;
    align-items: center;
    pointer-events: none;
    width: min(94vw, 480px);
  }
  .msg {
    width: 100%;
    display: flex;
    align-items: flex-start;
    gap: 9px;
    background: #22262b;
    border: 1px solid var(--line);
    border-left: 3px solid var(--dim);
    border-radius: 9px;
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.4;
    box-shadow: 0 10px 26px rgba(0,0,0,.45);
    animation: rise .16s ease-out;
    word-break: break-word;
  }
  .msg.work { border-left-color: var(--accent); }
  .msg.good { border-left-color: var(--ok); }
  .msg.bad  { border-left-color: var(--danger); }
  .msg .k {
    flex: none;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
    padding-top: 1px;
  }

  .spin {
    width: 12px; height: 12px; flex: none;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin-top: 2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 720px) {
    .brand span { display: none; }
    header { gap: 10px; padding-top: calc(8px + var(--safe-t)); }
    .print-desktop { display: none; }
  }
  @media (min-width: 721px) {
    .print-mobile { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand"><b>Label editor</b><span>Brother QL</span></div>

  <div class="health"><i class="dot" id="hdot"></i><span id="htext">checking printer</span></div>

  <label class="field">Label
    <select id="labelSel"></select>
  </label>

  <label class="field" id="lenWrap" hidden>Length px
    <input type="number" id="lenInp" min="50" max="3000" step="10" value="300">
  </label>

  <label class="field">Copies
    <input type="number" id="copies" min="1" max="50" value="1">
  </label>

  <label class="check" title="Turn the label a quarter turn: the tape width becomes the height and you type along the tape"><input type="checkbox" id="rotate"> Landscape</label>

  <button class="print print-desktop" id="printBtn">Print</button>
</header>

<main>
  <div id="stage">
    <div class="tag" id="tag"></div>
    <div class="stagerow">
      <div class="feed" id="feed" aria-label="Paper feed direction">
        <span class="head"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V4 M6 10l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="cap">Feed direction</span>
        <i class="rail"></i>
        <span class="foot">out last</span>
      </div>
      <div id="tape"></div>
    </div>
  </div>
</main>

<footer>
  <div class="props" id="props">
    <span class="cap" id="propsCap">Text</span>
    <input class="txt" type="number" id="fsize" min="6" max="400" step="2" value="40" aria-label="Font size">
    <button class="txt" id="boldBtn" style="font-weight:700">B</button>
    <span class="sep txt"></span>
    <button data-align="left" class="alignBtn txt" aria-label="Align left">L</button>
    <button data-align="center" class="alignBtn txt" aria-label="Align center">C</button>
    <button data-align="right" class="alignBtn txt" aria-label="Align right">R</button>
    <span class="sep txt"></span>
    <button id="slotBtn" class="slot" title="Turn this object into a fillable template slot">Make placeholder</button>
    <button id="unslotBtn" hidden>Unmark</button>
  </div>

  <div class="tools">
    <button id="addText">Add text</button>
    <button id="addImage">Add image</button>
    <button id="addIcon">Add icon</button>
    <button id="tplBtn">Templates</button>
    <button id="fillBtn" disabled title="Fill this label's placeholders">Fill</button>
    <button id="fwd" disabled title="Move the selected object one step towards the front">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h13v13H8z" fill="currentColor"/><path d="M3 8h5v8h8v5H3z" fill="currentColor" opacity=".45"/></svg>
      Bring forward
    </button>
    <button id="back" disabled title="Move the selected object behind everything else">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h13v13H3z" fill="currentColor"/><path d="M8 3h13v13h-5V8H8z" fill="currentColor" opacity=".45"/></svg>
      Send back
    </button>
    <button id="del" class="danger" disabled>Delete</button>
    <button class="print print-mobile grow" id="printBtnM">Print</button>
  </div>
</footer>

<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <div class="sheet-head"><span>Icons</span><button data-close style="min-height:32px;padding:5px 10px">Close</button></div>
    <div class="grid" id="iconGrid"></div>
  </div>
</div>

<div class="sheet" id="tplSheet">
  <div class="sheet-inner">
    <div class="sheet-head"><span>Templates</span><button data-close style="min-height:32px;padding:5px 10px">Close</button></div>
    <div class="list" id="tplList"></div>
    <div class="form">
      <label class="field">Save the current label as a new template
        <input type="text" id="tplName" placeholder="template name" autocomplete="off">
      </label>
    </div>
    <div class="row"><button class="grow" id="tplSave">Save as new template</button></div>
  </div>
</div>

<div class="sheet" id="slotSheet">
  <div class="sheet-inner">
    <div class="sheet-head"><span>Placeholder</span><button data-close style="min-height:32px;padding:5px 10px">Close</button></div>
    <div class="form">
      <label class="field">Slot name
        <input type="text" id="slotName" placeholder="e.g. product" autocomplete="off">
      </label>
      <label class="field">Type
        <select id="slotType">
          <option value="text">Text</option>
          <option value="image">Image</option>
          <option value="barcode">Barcode</option>
        </select>
      </label>
      <label class="field" id="fmtWrap" hidden>Barcode format
        <select id="slotFormat">
          <option value="CODE128">CODE128</option>
          <option value="CODE39">CODE39</option>
          <option value="EAN13">EAN13</option>
          <option value="EAN8">EAN8</option>
          <option value="UPC">UPC</option>
          <option value="ITF14">ITF14</option>
          <option value="QR">QR code</option>
        </select>
      </label>
      <label class="field">Default value
        <input type="text" id="slotDefault" placeholder="used when the field is left empty" autocomplete="off">
      </label>
      <div class="hint">The slot keeps this object's position and size. Filling replaces the artwork inside that box.</div>
    </div>
    <div class="row"><button class="print grow" id="slotApply">Apply</button></div>
  </div>
</div>

<div class="sheet" id="fillSheet">
  <div class="sheet-inner">
    <div class="sheet-head"><span>Fill placeholders</span><button data-close style="min-height:32px;padding:5px 10px">Close</button></div>
    <div class="form" id="fillForm"></div>
    <div class="row">
      <button class="grow" id="fillPreview">Fill only</button>
      <button class="print grow" id="fillPrint">Fill &amp; print</button>
    </div>
  </div>
</div>

<div id="status"></div>
<input type="file" id="filePick" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/fabric@6.4.3/dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------- icons
  // Inline 24x24 paths. `s: true` means the path is stroked, not filled --
  // outline glyphs stay legible at thermal-printer resolution.
  var ICONS = [
    { id: "arrow",   name: "Arrow",   d: "M2 10h12V5l8 7-8 7v-5H2z" },
    { id: "up",      name: "This up", d: "M12 21V4 M6 10l6-6 6 6", s: true },
    { id: "warning", name: "Warning", d: "M12 2 23 21H1z M11 9h2v6h-2z M11 17h2v2h-2z" },
    { id: "cold",    name: "Cold",    d: "M12 2v20 M2 12h20 M4.9 4.9 19.1 19.1 M19.1 4.9 4.9 19.1", s: true },
    { id: "hot",     name: "Hot",     d: "M12 2c4 4 6 6.5 6 10a6 6 0 0 1-12 0c0-2 1-3.5 2-4.5 0 1.5.5 2.5 1.5 3C9 8 10 4.5 12 2z" },
    { id: "liquid",  name: "Liquid",  d: "M12 2.5c4 5 7 8 7 11.5a7 7 0 0 1-14 0C5 10.5 8 7.5 12 2.5z" },
    { id: "power",   name: "Power",   d: "M13 2 4 14h6l-1 8 9-12h-6z" },
    { id: "medical", name: "Medical", d: "M9 2h6v7h7v6h-7v7H9v-7H2V9h7z" },
    { id: "box",     name: "Box",     d: "M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z M3 7.5 12 12l9-4.5 M12 12v9", s: true },
    { id: "date",    name: "Date",    d: "M4 6h16v15H4z M4 11h16 M8 3v5 M16 3v5", s: true },
    { id: "lock",    name: "Lock",    d: "M5 11h14v10H5z M8 11V7a4 4 0 0 1 8 0v4", s: true },
    { id: "no",      name: "No",      d: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z M5 5 19 19", s: true }
  ];

  function iconSVG(ic) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="' + ic.d + '"' +
      (ic.s
        ? ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'
        : ' fill="currentColor" fill-rule="evenodd"') +
      '/></svg>';
  }

  // ---------------------------------------------------------------- setup
  var $ = function (id) { return document.getElementById(id); };

  var tape = $("tape"), tag = $("tag");
  var canvasEl = document.createElement("canvas");
  tape.appendChild(canvasEl);

  var canvas = new fabric.Canvas(canvasEl, {
    backgroundColor: "#ffffff",
    preserveObjectStacking: true,
    selection: true,
    controlsAboveOverlay: true
  });

  // Monochrome thermal printer: everything is black on white, no colour UI.
  var OBJ = {
    fill: "#000000",
    cornerColor: "#ffb02e",
    cornerStrokeColor: "#0d0e10",
    borderColor: "#ffb02e",
    transparentCorners: false,
    cornerSize: 12,
    touchCornerSize: 40,
    padding: 2
  };

  var labels = [], current = null;

  // ------------------------------------------------------------- sizing
  // Backing store is always the exact printable pixel count so export is 1:1.
  // Display size is set separately with `cssOnly`, which Fabric compensates
  // for when it maps pointer events -- handles stay under the finger.
  //
  // Feed geometry, read off qlapi/printer.py -> brother_ql.conversion.convert:
  // the raster is written one line per image ROW, so the image WIDTH is the
  // fixed across-tape axis (dots_printable[0]) and the image HEIGHT runs along
  // the feed. Row 0 is sent first.
  //
  // Landscape is therefore a page-orientation setting, not an image rotation.
  // The tape is always 696 dots across; what changes is which axis of the
  // drawing lands on it. So landscape SWAPS THE CANVAS DIMENSIONS -- the
  // canvas becomes length x 696 -- and every object stays upright and
  // editable. The server's rotate=true then turns that 696-tall bitmap a
  // quarter turn into a 696-wide one, which is an exact fit: no rescale.
  // Nothing in the UI is ever visually rotated.
  function turned() { return $("rotate").checked; }

  // dots per mm, derived from the label itself rather than assuming 300 dpi
  function dotsPerMm(spec) {
    return spec.tape_size[0] ? spec.dots_total[0] / spec.tape_size[0] : 11.8;
  }

  // Landscape is only meaningful for endless tape. A die-cut label has both
  // axes fixed, so a quarter turn only fits if it happens to be square --
  // brother_ql raises "Bad image dimensions" for anything else.
  function canTurn(spec) {
    return !spec || spec.dots_printable[1] === 0 ||
      spec.dots_printable[0] === spec.dots_printable[1];
  }

  function fitToScreen() {
    if (!current) return;
    // The canvas dimensions already encode the orientation, so the display
    // box is just the canvas scaled down uniformly. No swapping, no rotation.
    var w = canvas.getWidth(), h = canvas.getHeight();
    var main = document.querySelector("main");
    var railW = turned() ? 0 : 46;   // rail sits beside the tape only in portrait
    var railH = turned() ? 32 : 0;   // ...and above it in landscape
    var availW = main.clientWidth - 40 - railW;
    var availH = main.clientHeight - 62 - railH;
    var k = Math.min(availW / w, availH / h, 1);
    var dw = Math.round(w * k), dh = Math.round(h * k);
    canvas.setDimensions({ width: dw + "px", height: dh + "px" }, { cssOnly: true });
    tape.style.width = dw + "px";
    tape.style.height = dh + "px";
  }

  function applyLabel(spec, lengthPx) {
    current = spec;
    var across = spec.dots_printable[0];
    var len = spec.dots_printable[1] || lengthPx;
    // Portrait: across-tape axis is the width. Landscape: it is the height.
    var w = turned() ? len : across;
    var h = turned() ? across : len;
    canvas.setDimensions({ width: w, height: h });
    canvas.backgroundColor = "#ffffff";
    tape.classList.toggle("diecut", spec.dots_printable[1] > 0);

    // The tape width is the one fixed physical fact, so state it in mm along
    // with the free axis. Both orientations print at exactly this size.
    var mmAcross = Math.round(across / dotsPerMm(spec));
    var mmLen = Math.round(len / dotsPerMm(spec));
    tag.innerHTML = spec.name + " &middot; " + (turned() ? "landscape" : "portrait") +
      " &middot; <b>" + w + " &times; " + h + " px</b> &middot; " +
      mmAcross + " mm tape, " + mmLen + " mm long";

    fitToScreen();
    canvas.requestRenderAll();
  }

  // Orientation only swaps the canvas dimensions, so objects stay upright and
  // fully editable -- there is no CSS rotation anywhere and therefore none of
  // Fabric's pointer-mapping trouble. Objects are not moved, so anything that
  // now sits off the shorter axis has to be dragged back in.
  function applyTurn() {
    var on = turned();
    tape.classList.toggle("turned", on);
    $("feed").classList.toggle("turned", on);
    document.querySelector(".stagerow").classList.toggle("turned", on);
    $("feed").setAttribute("aria-label", on
      ? "Paper feed direction: the right edge leaves the printer first"
      : "Paper feed direction: the top edge leaves the printer first");
  }

  function defaultFontSize() {
    return Math.max(18, Math.round(Math.min(canvas.getWidth(), canvas.getHeight()) * 0.18));
  }

  // ------------------------------------------------------------- status
  var statusBox = $("status");
  function say(kind, key, text, sticky) {
    var el = document.createElement("div");
    el.className = "msg " + kind;
    el.innerHTML = kind === "work" ? '<i class="spin"></i>' : '<span class="k">' + key + "</span>";
    el.appendChild(document.createTextNode(text));
    statusBox.appendChild(el);
    if (!sticky) setTimeout(function () { el.remove(); }, 4200);
    return el;
  }

  // ------------------------------------------------------------- objects
  function place(obj) {
    canvas.add(obj);
    canvas.viewportCenterObject(obj);
    canvas.setActiveObject(obj);
    canvas.requestRenderAll();
  }

  function newTextbox(extra) {
    return new fabric.Textbox("Text", Object.assign({}, OBJ, {
      width: Math.round(canvas.getWidth() * 0.8),
      fontSize: defaultFontSize(),
      fontFamily: "Helvetica, Arial, sans-serif",
      textAlign: "center",
      editable: true
    }, extra || {}));
  }

  $("addText").onclick = function () { place(newTextbox()); };

  // Double-click / double-tap on bare tape drops a textbox there, ready to
  // type. `opt.target` is set when the gesture hit an object, and those keep
  // Fabric's own behaviour (inline editing for text).
  function textAt(e) {
    var p = canvas.getScenePoint(e);
    var t = newTextbox({ left: p.x, top: p.y, originX: "center", originY: "center" });
    canvas.add(t);
    canvas.setActiveObject(t);
    t.enterEditing();
    t.selectAll();
    canvas.requestRenderAll();
    syncUI();
  }

  var lastSpawn = 0;
  function spawnText(e) {
    var now = Date.now();
    if (now - lastSpawn < 600) return;  // one textbox per gesture
    lastSpawn = now;
    textAt(e);
  }

  canvas.on("mouse:dblclick", function (opt) {
    if (!opt.target) spawnText(opt.e);
  });

  // Touch keyboards rarely deliver a native dblclick, so detect the tap pair
  // ourselves. Guarded to touch only, otherwise a mouse double-click would
  // arrive twice.
  var lastTap = 0, lastTapX = 0, lastTapY = 0;
  canvas.on("mouse:down", function (opt) {
    var e = opt.e;
    if (!e || e.pointerType !== "touch") return;
    var now = Date.now();
    var p = canvas.getScenePoint(e);
    var near = Math.abs(p.x - lastTapX) < 40 && Math.abs(p.y - lastTapY) < 40;
    if (!opt.target && now - lastTap < 350 && near) {
      lastTap = 0;
      spawnText(e);
      return;
    }
    lastTap = now; lastTapX = p.x; lastTapY = p.y;
  });

  $("filePick").onchange = function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    var url = URL.createObjectURL(file);
    fabric.FabricImage.fromURL(url).then(function (img) {
      URL.revokeObjectURL(url);
      img.set(OBJ);
      img.set("fill", null);
      var k = Math.min(canvas.getWidth() / img.width, canvas.getHeight() / img.height, 1) * 0.8;
      img.scale(k);
      place(img);
    }).catch(function () {
      URL.revokeObjectURL(url);
      say("bad", "error", "Could not read that image.");
    });
  };
  $("addImage").onclick = function () { $("filePick").click(); };

  var sheet = $("sheet");
  $("addIcon").onclick = function () { sheet.classList.add("on"); };

  // Every sheet closes the same two ways: its Close button, or the backdrop.
  Array.prototype.forEach.call(document.querySelectorAll(".sheet"), function (s) {
    s.onclick = function (e) { if (e.target === s) s.classList.remove("on"); };
    var x = s.querySelector("[data-close]");
    if (x) x.onclick = function () { s.classList.remove("on"); };
  });

  ICONS.forEach(function (ic) {
    var b = document.createElement("button");
    b.innerHTML = iconSVG(ic) + "<span>" + ic.name + "</span>";
    b.onclick = function () {
      sheet.classList.remove("on");
      var side = Math.round(Math.min(canvas.getWidth(), canvas.getHeight()) * 0.5);
      var p = new fabric.Path(ic.d, Object.assign({}, OBJ, ic.s
        ? { fill: null, stroke: "#000000", strokeWidth: 2, strokeLineCap: "round", strokeLineJoin: "round" }
        : { fill: "#000000", fillRule: "evenodd" }));
      p.scaleToWidth(side);
      place(p);
    };
    $("iconGrid").appendChild(b);
  });

  $("del").onclick = function () {
    canvas.getActiveObjects().forEach(function (o) { canvas.remove(o); });
    canvas.discardActiveObject();
    canvas.requestRenderAll();
  };
  $("fwd").onclick = function () {
    var o = canvas.getActiveObject();
    if (o) { canvas.bringObjectForward(o); canvas.requestRenderAll(); }
  };
  $("back").onclick = function () {
    var o = canvas.getActiveObject();
    if (o) { canvas.sendObjectToBack(o); canvas.requestRenderAll(); }
  };

  document.addEventListener("keydown", function (e) {
    if ((e.key === "Delete" || e.key === "Backspace") &&
        !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      var o = canvas.getActiveObject();
      if (o && !o.isEditing) { e.preventDefault(); $("del").click(); }
    }
  });

  // ------------------------------------------------------- text props bar
  var props = $("props"), fsize = $("fsize"), boldBtn = $("boldBtn");
  var alignBtns = Array.prototype.slice.call(document.querySelectorAll(".alignBtn"));

  function activeText() {
    var o = canvas.getActiveObject();
    return o && o.type === "textbox" ? o : null;
  }

  function syncUI() {
    var o = canvas.getActiveObject();
    ["del", "fwd", "back"].forEach(function (id) { $(id).disabled = !o; });
    var t = activeText();
    // One bar for everything: the text controls hide for images and icons, the
    // placeholder controls are always there as long as something is selected.
    props.classList.toggle("on", !!o);
    props.classList.toggle("notext", !t);
    var single = o && o.type !== "activeselection";
    $("propsCap").textContent = o && o.placeholder ? "Slot" : (t ? "Text" : "Object");
    $("slotBtn").hidden = !single;
    $("slotBtn").textContent = single && o.placeholder ? "Edit placeholder" : "Make placeholder";
    $("unslotBtn").hidden = !(single && o.placeholder);
    if (!t) return;
    fsize.value = Math.round(t.fontSize);
    boldBtn.classList.toggle("sel", t.fontWeight === "bold");
    alignBtns.forEach(function (b) { b.classList.toggle("sel", b.dataset.align === t.textAlign); });
  }

  function setText(key, value) {
    var t = activeText();
    if (!t) return;
    t.set(key, value);
    canvas.requestRenderAll();
    syncUI();
  }
  fsize.oninput = function () {
    var v = parseInt(fsize.value, 10);
    if (v >= 6 && v <= 400) setText("fontSize", v);
  };
  boldBtn.onclick = function () {
    var t = activeText();
    if (t) setText("fontWeight", t.fontWeight === "bold" ? "normal" : "bold");
  };
  alignBtns.forEach(function (b) {
    b.onclick = function () { setText("textAlign", b.dataset.align); };
  });

  canvas.on("selection:created", syncUI);
  canvas.on("selection:updated", syncUI);
  canvas.on("selection:cleared", syncUI);

  // ---------------------------------------------------------- placeholders
  // A placeholder is an ordinary Fabric object carrying five extra props. They
  // are not part of Fabric's own schema, so toObject() has to be handed the
  // list explicitly -- see templateJSON(). On the way back in, Fabric copies
  // unknown keys straight onto the revived object, so the round trip holds.
  var SLOT_PROPS = ["placeholder", "slotName", "slotType", "slotFormat", "slotDefault"];

  function slots() {
    return canvas.getObjects().filter(function (o) { return o.placeholder; });
  }

  function syncFill() { $("fillBtn").disabled = !slots().length; }
  canvas.on("object:added", syncFill);
  canvas.on("object:removed", syncFill);

  // Marker chrome, drawn straight onto the visible canvas after each render.
  // It never reaches the print: toCanvasElement() renders into a context of
  // its own, and this only ever touches the on-screen one.
  canvas.on("after:render", function () {
    var list = slots();
    if (!list.length) return;
    var ctx = canvas.getContext();
    var k = canvas.getWidth() / (canvas.lowerCanvasEl.clientWidth || canvas.getWidth());
    ctx.save();
    ctx.setLineDash([6 * k, 4 * k]);
    ctx.lineWidth = Math.max(1, k);
    ctx.strokeStyle = "rgba(255,176,46,.9)";
    ctx.fillStyle = "rgba(255,176,46,.9)";
    ctx.font = Math.round(11 * k) + "px " + "ui-monospace, Menlo, monospace";
    ctx.textBaseline = "bottom";
    list.forEach(function (o) {
      var r = o.getBoundingRect(), pad = 3 * k;
      ctx.strokeRect(r.left - pad, r.top - pad, r.width + pad * 2, r.height + pad * 2);
      ctx.fillText("{" + (o.slotName || "slot") + "}", r.left - pad, Math.max(12 * k, r.top - pad - 2 * k));
    });
    ctx.restore();
  });

  var slotSheet = $("slotSheet"), slotType = $("slotType"), fmtWrap = $("fmtWrap");
  function syncFmt() { fmtWrap.hidden = slotType.value !== "barcode"; }
  slotType.onchange = syncFmt;

  $("slotBtn").onclick = function () {
    var o = canvas.getActiveObject();
    if (!o) return;
    var isText = o.type === "textbox";
    $("slotName").value = o.slotName || (isText ? "text" : "art");
    slotType.value = o.slotType || (isText ? "text" : "image");
    $("slotFormat").value = o.slotFormat || "CODE128";
    $("slotDefault").value = o.slotDefault || (isText ? o.text : "");
    syncFmt();
    slotSheet.classList.add("on");
  };

  $("slotApply").onclick = function () {
    var o = canvas.getActiveObject();
    if (!o) return;
    var name = ($("slotName").value || "").trim();
    if (!name) { say("bad", "name", "Give the slot a name first."); return; }
    o.set({
      placeholder: true,
      slotName: name,
      slotType: slotType.value,
      slotFormat: slotType.value === "barcode" ? $("slotFormat").value : "",
      slotDefault: $("slotDefault").value
    });
    slotSheet.classList.remove("on");
    canvas.requestRenderAll();
    syncUI();
    syncFill();
  };

  $("unslotBtn").onclick = function () {
    var o = canvas.getActiveObject();
    if (!o) return;
    o.set({ placeholder: false, slotName: "", slotType: "", slotFormat: "", slotDefault: "" });
    canvas.requestRenderAll();
    syncUI();
    syncFill();
  };

  // ------------------------------------------------------------- templates
  var tplSheet = $("tplSheet"), tplList = $("tplList");

  async function api(url, opts) {
    var res = await fetch(url, opts);
    if (!res.ok) throw new Error(await detail(res));
    return res.status === 204 ? null : res.json();
  }

  function templateJSON() { return canvas.toObject(SLOT_PROPS); }

  function body(name) {
    var spec = chosen();
    return {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: name,
        label_identifier: spec ? spec.identifier : "",
        canvas: templateJSON()
      })
    };
  }

  // Controls are styling, not state, so Fabric does not serialise them -- put
  // the editor's look back on every revived object.
  function restyle() {
    canvas.getObjects().forEach(function (o) {
      o.set(Object.assign({}, OBJ, { fill: o.fill }));
      o.setCoords();
    });
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function tplRow(t) {
    var el = document.createElement("div");
    el.className = "item";
    el.innerHTML = '<div class="nm"><b>' + esc(t.name) + '</b>' +
      '<span class="sub">label ' + esc(t.label_identifier) + '</span></div>';

    function mk(text, cls, fn) {
      var b = document.createElement("button");
      b.textContent = text;
      if (cls) b.className = cls;
      b.onclick = fn;
      el.appendChild(b);
      return b;
    }

    mk("Load", "", async function () {
      try {
        var full = await api("/templates/" + encodeURIComponent(t.id));
        await canvas.loadFromJSON(full.canvas);
        restyle();
        canvas.requestRenderAll();
        syncFill();
        tplSheet.classList.remove("on");
        $("tplName").value = t.name;
        say("good", "loaded", slots().length
          ? 'Loaded "' + t.name + '". Tap Fill to enter the values.'
          : 'Loaded "' + t.name + '".');
      } catch (err) { say("bad", "error", err.message, false); }
    });

    mk("Save", "", async function () {
      if (!confirm('Overwrite "' + t.name + '" with what is on the canvas now?')) return;
      try {
        await api("/templates/" + encodeURIComponent(t.id), body(t.name));
        say("good", "saved", 'Updated "' + t.name + '".');
      } catch (err) { say("bad", "error", err.message, false); }
    });

    mk("Delete", "danger", async function () {
      if (!confirm('Delete "' + t.name + '"? This cannot be undone.')) return;
      try {
        await api("/templates/" + encodeURIComponent(t.id), { method: "DELETE" });
        loadTemplates();
      } catch (err) { say("bad", "error", err.message, false); }
    });

    return el;
  }

  async function loadTemplates() {
    tplList.innerHTML = '<div class="empty">Loading&hellip;</div>';
    try {
      var list = await api("/templates");
      tplList.innerHTML = "";
      if (!list.length) {
        tplList.innerHTML = '<div class="empty">No templates yet. Lay out a label, mark the parts that change as placeholders, then save it here.</div>';
        return;
      }
      list.forEach(function (t) { tplList.appendChild(tplRow(t)); });
    } catch (err) {
      tplList.innerHTML = '<div class="empty">Could not load templates.</div>';
      say("bad", "error", err.message, false);
    }
  }

  $("tplBtn").onclick = function () { tplSheet.classList.add("on"); loadTemplates(); };

  $("tplSave").onclick = async function () {
    var name = ($("tplName").value || "").trim();
    if (!name) { say("bad", "name", "Name the template first."); return; }
    try {
      await api("/templates", body(name));
      say("good", "saved", 'Saved "' + name + '".');
      loadTemplates();
    } catch (err) { say("bad", "error", err.message, false); }
  };

  // --------------------------------------------------------- instantiation
  var fillSheet = $("fillSheet"), fillForm = $("fillForm"), fillFiles = {};

  function buildFill() {
    fillForm.innerHTML = "";
    fillFiles = {};
    slots().forEach(function (o) {
      var w = document.createElement("label");
      w.className = "field";
      w.appendChild(document.createTextNode(
        o.slotName + (o.slotType === "barcode" ? " \u00b7 " + (o.slotFormat || "CODE128") : "")));
      var inp;
      if (o.slotType === "image") {
        inp = document.createElement("input");
        inp.type = "file";
        inp.accept = "image/*";
        inp.onchange = function () { fillFiles[o.slotName] = inp.files[0] || null; };
      } else if (o.slotType === "text") {
        inp = document.createElement("textarea");
        inp.rows = 2;
        inp.value = o.slotDefault || o.text || "";
      } else {
        inp = document.createElement("input");
        inp.type = "text";
        inp.value = o.slotDefault || "";
      }
      inp.dataset.slot = o.slotName;
      w.appendChild(inp);
      fillForm.appendChild(w);
    });
  }

  $("fillBtn").onclick = function () { buildFill(); fillSheet.classList.add("on"); };

  function imageEl(file) {
    return new Promise(function (ok, fail) {
      var url = URL.createObjectURL(file);
      var im = new Image();
      im.onload = function () { URL.revokeObjectURL(url); ok(im); };
      im.onerror = function () { URL.revokeObjectURL(url); fail(new Error("Could not read " + file.name + ".")); };
      im.src = url;
    });
  }

  // Both barcode libraries draw onto a plain canvas element, which Fabric can
  // wrap directly -- no data-URL detour. Black on white, like everything else.
  function barcodeEl(format, data) {
    var c = document.createElement("canvas");
    if (format === "QR") {
      try {
        // QRious draws synchronously onto the element it is handed.
        new QRious({
          element: c, value: data, size: 512, padding: 8,
          background: "#ffffff", foreground: "#000000"
        });
      } catch (err) {
        return Promise.reject(new Error('"' + data + '" is not valid QR data.'));
      }
      return Promise.resolve(c);
    }
    try {
      JsBarcode(c, data, {
        format: format || "CODE128",
        background: "#ffffff",
        lineColor: "#000000",
        height: 120,
        margin: 6,
        displayValue: true
      });
    } catch (err) {
      return Promise.reject(new Error('"' + data + '" is not valid ' + format + " data."));
    }
    return Promise.resolve(c);
  }

  // The new artwork inherits the slot's box and its slot props, so the same
  // label can be filled again without reloading the template.
  function swap(o, el) {
    var r = o.getBoundingRect();
    var idx = canvas.getObjects().indexOf(o);
    var img = new fabric.FabricImage(el, Object.assign({}, OBJ, {
      fill: null,
      left: r.left, top: r.top, originX: "left", originY: "top",
      placeholder: true,
      slotName: o.slotName, slotType: o.slotType,
      slotFormat: o.slotFormat, slotDefault: o.slotDefault
    }));
    img.scale(Math.min(r.width / img.width, r.height / img.height));
    canvas.remove(o);
    canvas.add(img);
    canvas.moveObjectTo(img, idx);
  }

  // Works on the label in the editor, never on the stored template -- that one
  // only ever changes when Save is pressed.
  async function applyFill() {
    var vals = {};
    Array.prototype.forEach.call(fillForm.querySelectorAll("[data-slot]"), function (i) {
      vals[i.dataset.slot] = i.value;
    });
    var list = slots();
    for (var i = 0; i < list.length; i++) {
      var o = list[i];
      if (o.slotType === "text") {
        o.set("text", vals[o.slotName] || o.slotDefault || "");
      } else if (o.slotType === "image") {
        var f = fillFiles[o.slotName];
        if (f) swap(o, await imageEl(f));
      } else {
        var data = (vals[o.slotName] || o.slotDefault || "").trim();
        if (data) swap(o, await barcodeEl(o.slotFormat, data));
      }
    }
    canvas.discardActiveObject();
    canvas.requestRenderAll();
    syncUI();
  }

  async function fill(thenPrint) {
    fillSheet.classList.remove("on");
    try {
      await applyFill();
    } catch (err) {
      say("bad", "error", err.message, false);
      return;
    }
    if (thenPrint) print();
  }

  $("fillPreview").onclick = function () { fill(false); };
  $("fillPrint").onclick = function () { fill(true); };

  // ---------------------------------------------------------------- print
  function terminal(s) { return s === "done" || s === "failed"; }

  async function detail(res) {
    try {
      var body = await res.json();
      if (body && body.detail) return typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
    } catch (err) { /* non-JSON error body */ }
    return "Server responded " + res.status + ".";
  }

  var printing = false;
  var printBtns = [$("printBtn"), $("printBtnM")];

  function setPrinting(on) {
    printing = on;
    printBtns.forEach(function (b) {
      b.disabled = on;
      b.classList.toggle("busy", on);
      b.textContent = on ? "Printing" : "Print";
    });
  }

  async function print() {
    if (printing) return;
    setPrinting(true);
    var note = say("work", "", "Preparing image", true);
    try {
      canvas.discardActiveObject();
      canvas.renderAll();

      // toCanvasElement(1) reproduces the backing store exactly: 1 canvas
      // pixel == 1 printer dot. Selection handles are not drawn.
      var out = canvas.toCanvasElement(1);
      var blob = await new Promise(function (r) { out.toBlob(r, "image/png"); });
      if (!blob) throw new Error("The canvas could not be exported.");

      var fd = new FormData();
      fd.append("label_file", blob, "label.png"); // server validates by extension
      note.remove();
      note = say("work", "", "Sending to printer", true);

      var q = "?rotate=" + ($("rotate").checked ? "true" : "false") +
              "&copies=" + encodeURIComponent($("copies").value || "1");
      var res = await fetch("/job" + q, { method: "POST", body: fd });
      if (!res.ok) {
        note.remove();
        say("bad", res.status === 503 ? "printer" : "rejected", await detail(res), false);
        return;
      }

      var job = await res.json();
      note.remove();
      note = say("work", "", "Queued", true);

      // Poll until the worker reports a terminal state.
      var last = job.status;
      for (var i = 0; i < 150; i++) {
        await new Promise(function (r) { setTimeout(r, 700); });
        var sres = await fetch("/job/" + encodeURIComponent(job.job_id));
        if (!sres.ok) { note.remove(); say("bad", "error", await detail(sres)); return; }
        var s = await sres.json();
        if (s.status !== last) {
          last = s.status;
          note.remove();
          note = say("work", "", s.status === "printing" ? "Printing" : "Queued", true);
        }
        if (terminal(s.status)) {
          note.remove();
          if (s.status === "done") say("good", "done", "Printed " + $("copies").value + " cop" + ($("copies").value === "1" ? "y" : "ies") + ".");
          else say("bad", "failed", s.error || "The print job failed.", false);
          return;
        }
      }
      note.remove();
      say("bad", "timeout", "Still not finished. Job id " + job.job_id + ".", false);
    } catch (err) {
      note.remove();
      say("bad", "error", err && err.message ? err.message : "Could not reach the server.", false);
    } finally {
      setPrinting(false);
      checkHealth();
    }
  }
  printBtns.forEach(function (b) { b.onclick = print; });

  // ---------------------------------------------------------------- health
  async function checkHealth() {
    var dot = $("hdot"), txt = $("htext");
    try {
      var res = await fetch("/health");
      var list = await res.json();
      var p = list[0];
      if (!p) throw new Error("no printer");
      dot.className = "dot " + (p.available ? "up" : "down");
      txt.textContent = p.available ? p.model + " ready" : (p.error || "printer unavailable");
    } catch (err) {
      dot.className = "dot down";
      txt.textContent = "printer unreachable";
    }
  }

  // ---------------------------------------------------------------- labels
  var sel = $("labelSel"), lenWrap = $("lenWrap"), lenInp = $("lenInp");

  function chosen() { return labels[sel.selectedIndex]; }

  function refresh() {
    var spec = chosen();
    if (!spec) return;
    var endless = spec.dots_printable[1] === 0;
    lenWrap.hidden = !endless;
    // A non-square die-cut label cannot be turned at all, so don't offer it.
    var rot = $("rotate");
    if (!canTurn(spec) && rot.checked) rot.checked = false;
    rot.disabled = !canTurn(spec);
    rot.parentNode.classList.toggle("off", !canTurn(spec));
    applyTurn();
    applyLabel(spec, parseInt(lenInp.value, 10) || 300);
  }

  sel.onchange = refresh;
  lenInp.onchange = refresh;
  $("rotate").onchange = refresh;
  window.addEventListener("resize", fitToScreen);
  window.addEventListener("orientationchange", function () { setTimeout(fitToScreen, 250); });

  (async function boot() {
    checkHealth();
    try {
      var res = await fetch("/labels");
      labels = await res.json();
      if (!labels.length) throw new Error("no labels");
      labels.forEach(function (l, i) {
        var o = document.createElement("option");
        o.textContent = l.name + (l.is_default ? " (default)" : "");
        o.value = String(i);
        sel.appendChild(o);
      });
      var def = labels.findIndex(function (l) { return l.is_default; });
      sel.selectedIndex = def >= 0 ? def : 0;
      refresh();
    } catch (err) {
      say("bad", "error", "Could not load label sizes from the server.", true);
    }
  })();
})();
</script>
</body>
</html>
