services:
  qlapi:
    build:
      context: ./qlapi
      dockerfile: Dockerfile
    image: "ghcr.io/thiagobell/qlapi:latest"
    environment:
      # when running in a docker environment, need to use the linux_kernel backend of brother_ql
      # Otherwise, would need to start the container in privileged mode
      - QL_PRINTER_MODEL=QL-570
      - QL_PRINTER_DEVICE=/dev/usb/lp0
      - QL_BACKEND=linux_kernel
      # store label templates outside the container image so they persist
      # across container recreation (see volumes below)
      - QL_TEMPLATES_DIR=/data/templates
    volumes:
      # mount a host directory (or named volume) to persist label templates
      - ./qlapi/templates:/data/templates
    devices:
      # mount here the corresponding device to lp0 in the container (should match env. var above)
      - /dev/usb/lp2:/dev/usb/lp0
    ports:
      - 8000:80
    restart: unless-stopped

  printbot:
    build:
      context: ./printbot
      dockerfile: Dockerfile
    image: "ghcr.io/thiagobell/printbot:latest"
    volumes:
      # copy printbot/config.example.yaml to printbot/config.yaml and fill it in first
      - ./printbot/config.yaml:/app/config.yaml:ro
    depends_on:
      - qlapi
    restart: unless-stopped
